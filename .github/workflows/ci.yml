name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install converters (for the integration tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libvips-tools libheif-examples libheif-plugin-libde265
      - run: go vet ./...
      - run: go test ./...
